[workspace]
members = [
    "crates/echodorsal-domain",
    "crates/echodorsal-orca",
    "crates/echodorsal-alexa",
    "crates/echodorsal-store",
    "crates/echodorsal-usage",
    "crates/echodorsal-refiner",
    "crates/echodorsal-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

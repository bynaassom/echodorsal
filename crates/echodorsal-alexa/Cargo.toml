[package]
name = "echodorsal-alexa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
echodorsal-domain = { path = "../echodorsal-domain", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }

base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1.13"
webpki-roots = "1.0"
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

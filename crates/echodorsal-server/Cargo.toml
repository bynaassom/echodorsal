[package]
name = "echodorsal-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
echodorsal-alexa = { path = "../echodorsal-alexa", version = "0.1.0" }
echodorsal-domain = { path = "../echodorsal-domain", version = "0.1.0" }
echodorsal-orca = { path = "../echodorsal-orca", version = "0.1.0" }
echodorsal-refiner = { path = "../echodorsal-refiner", version = "0.1.0" }
echodorsal-store = { path = "../echodorsal-store", version = "0.1.0" }
echodorsal-usage = { path = "../echodorsal-usage", version = "0.1.0" }

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
